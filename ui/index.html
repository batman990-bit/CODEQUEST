<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>CodeQuest</title>
</head>
<body>
    <div class="container">
        <canvas id="terminal-canvas"></canvas>
        <div class="terminal-ui">
            <div class="output">
                <div>World generated . Start typing to begin and have fun!</div>
            </div>
            <div class="input-line">
                <span class="prompt">user@system;~$</span>
                <input type="text" autofocus />
                
            </div>
        </div>
        <div class="game-content">
                <button class="run-button">Run Code</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
